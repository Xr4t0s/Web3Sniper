[package]
name = "web3sniper"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.4.1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
